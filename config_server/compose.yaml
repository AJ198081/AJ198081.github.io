services:
  postgres:
    image: 'postgres:latest'
    container_name: 'config_server_compose_container'
    restart: no
    environment:
      - 'POSTGRES_DB=microservice_1'
      - 'POSTGRES_USER=admin'
      - 'POSTGRES_PASSWORD=password'
    ports:
      - '7073:5432'
    volumes:
      - ./src/test/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  rabbit-mq:
    image: 'rabbitmq:4.1-management'
    container_name: 'gateway_broker_container'
    restart: no
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
      - deprecated_features.permit.queue_master_locator=true
    ports:
      - '5672:5672'
      - '15672:15672'
#    volumes:
#      - ./rabbitmq/90-permit-deprecated.conf:/etc/rabbitmq/conf.d/90-permit-deprecated.conf:ro
    networks:
      - config_server_network

networks:
  config_server_network:
    driver: bridge
    name: config_server_network
#    external: true
